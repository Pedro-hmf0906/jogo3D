<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooter 3D — WebGL</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main>
    <canvas id="tela" width="960" height="600"></canvas>
    <p id="ajuda">WASD ou setas = mover &nbsp;·&nbsp; ESPAÇO = atirar &nbsp;·&nbsp; ESC = pausar</p>
    <p id="hud"></p>
    <div id="carga" class="pronta"><span id="cargaTxt"></span><div id="cargaBarra"><div id="cargaCheia"></div></div></div>
    <div id="progresso"><span id="pct">Chegada: 0%</span><div id="barra"><div id="barraCheia"></div></div></div>
    <p id="pausa" hidden>PAUSADO</p>
    <p id="fim" hidden>GAME OVER<small>pressione R ou Enter para jogar de novo</small></p>
    <p id="vitoria" hidden></p>
    <pre id="erro" hidden></pre>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
